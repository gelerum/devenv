name: image

on:
  push:
    branches: [main]
    paths-ignore: ['**.md']
  # Шлёт workflow notify-devenv из репозитория dotfiles
  repository_dispatch:
    types: [dotfiles-updated]
  workflow_dispatch:

# Сборки идут строго по очереди, чтобы обновления dotfiles не перетирали друг друга
concurrency:
  group: image
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/${{ github.repository }}
  DOTFILES_REPO: https://github.com/gelerum/dotfiles

jobs:
  # Закрепляет в Dockerfile текущий коммит dotfiles. Так каждый образ соответствует
  # коммиту этого репозитория и его можно пересобрать заново
  bump-dotfiles:
    if: github.event_name == 'repository_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      sha: ${{ steps.commit.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Обновить DOTFILES_REF и NVIM_REF
        run: |
          git clone -q --filter=blob:none --no-checkout "$DOTFILES_REPO" "$RUNNER_TEMP/dotfiles"
          ref=$(git -C "$RUNNER_TEMP/dotfiles" rev-parse HEAD)
          nvim=$(git -C "$RUNNER_TEMP/dotfiles" log -1 --format=%H HEAD -- nvim)
          sed -i -E \
            -e "s/^ARG DOTFILES_REF=.*/ARG DOTFILES_REF=$ref/" \
            -e "s/^ARG NVIM_REF=.*/ARG NVIM_REF=$nvim/" \
            Dockerfile
          echo "DOTFILES_SHORT=${ref::7}" >> "$GITHUB_ENV"

      # Push через GITHUB_TOKEN не запускает workflow повторно, поэтому сборка идёт в этом же запуске
      - id: commit
        name: Закоммитить
        run: |
          if git diff --quiet; then
            echo "Dockerfile уже указывает на актуальный коммит dotfiles"
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -qam "Update dotfiles to $DOTFILES_SHORT"
          git push -q
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  build:
    needs: bump-dotfiles
    # Запускается и когда bump-dotfiles пропущен (обычный push)
    if: ${{ !failure() && !cancelled() }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.bump-dotfiles.outputs.sha || github.sha }}

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Прочитать зафиксированный коммит dotfiles
        run: |
          echo "DOTFILES_REF=$(sed -n 's/^ARG DOTFILES_REF=//p' Dockerfile | cut -c1-7)" >> "$GITHUB_ENV"

      # GHCR показывает на странице пакета только source, description и licenses.
      # У образа с индексом description берётся из annotations, поэтому они пишутся и в индекс
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        env:
          DOCKER_METADATA_ANNOTATIONS_LEVELS: manifest,index
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest
            type=sha,prefix=sha-
          labels: |
            org.opencontainers.image.description=Dev environment · dotfiles ${{ env.DOTFILES_REF }}
          annotations: |
            org.opencontainers.image.description=Dev environment · dotfiles ${{ env.DOTFILES_REF }}

      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
