services:
  common:
    image: ${DEVENV_IMAGE:-ghcr.io/gelerum/devenv:latest}
    init: true
    # uid 1000 в контейнере = вы на хосте (rootless podman)
    userns_mode: keep-id
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    env_file:
      - path: ${HOME}/.config/devenv/agents/claude/auth/claude.env
        required: false
    environment:
      - TERM
      - COLORTERM
      - EDITOR=nvim
      # Рефлексия памяти pi при выходе выполняется локальной моделью.
      - PI_MEMORY_REFLECT_MODEL=${PI_MEMORY_REFLECT_MODEL:-calculation/qwen3.6-35b-a3b}
      # Языки для LSP из mason, например "go python". Пусто - все
      - DEVENV_LANGS

      - GIT_CONFIG_COUNT=2
      - GIT_CONFIG_KEY_0=commit.gpgsign
      - GIT_CONFIG_VALUE_0=false
      - GIT_CONFIG_KEY_1=tag.gpgsign
      - GIT_CONFIG_VALUE_1=false
    volumes:
      # Единая структура: config/data синхронизируются, auth — только локально.
      - ${HOME}/.config/devenv/agents/claude/config:/run/agents/claude/config:z
      - ${HOME}/.config/devenv/agents/claude/auth:/run/agents/claude/auth:z
      - ${HOME}/.config/devenv/agents/claude/data:/run/agents/claude/data:z
      - ${HOME}/.config/devenv/agents/claude/data/projects:/home/q/.claude/projects:z
      - ${HOME}/.config/devenv/agents/codex/config:/run/agents/codex/config:z
      - ${HOME}/.config/devenv/agents/codex/auth:/run/agents/codex/auth:z
      - ${HOME}/.config/devenv/agents/codex/data:/run/agents/codex/data:z
      - ${HOME}/.config/devenv/agents/codex/data/sessions:/home/q/.codex/sessions:z
      - ${HOME}/.config/devenv/agents/codex/data/archived_sessions:/home/q/.codex/archived_sessions:z
      - ${HOME}/.config/devenv/agents/codex/data/memories:/home/q/.codex/memories:z
      - ${HOME}/.local/share/devenv/agents/codex/sqlite:/home/q/.local/state/codex/sqlite:z
      - ${HOME}/.config/devenv/agents/pi/config:/run/agents/pi/config:z
      - ${HOME}/.config/devenv/agents/pi/auth:/run/agents/pi/auth:z
      - ${HOME}/.config/devenv/agents/pi/data/sessions:/home/q/.pi/agent/sessions:z
      - ${HOME}/.config/devenv/agents/pi/data/memory:/home/q/.pi/agent/memory:z
      - ${HOME}/.config/devenv/agents/pi/data/subagents:/home/q/.pi/agent/subagents:z
      - devenv-cache:/home/q/.cache/devenv
      - devenv-mason:/home/q/.local/share/nvim/mason
      # Папка, а не том: так store видно на хосте. Отдельно от /nix хоста
      - ${HOME}/.local/share/devenv/nix:/nix:z
