services:
  common:
    image: ${DEVENV_IMAGE:-ghcr.io/gelerum/devenv:latest}
    init: true
    # uid 1000 в контейнере = вы на хосте (rootless podman)
    userns_mode: keep-id
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    env_file:
      - ${HOME}/.config/devenv/claude.env
    environment:
      - TERM
      - COLORTERM
      - EDITOR=nvim
      # Языки для LSP из mason, например "go python". Пусто - все
      - DEVENV_LANGS

      - GIT_CONFIG_COUNT=2
      - GIT_CONFIG_KEY_0=commit.gpgsign
      - GIT_CONFIG_VALUE_0=false
      - GIT_CONFIG_KEY_1=tag.gpgsign
      - GIT_CONFIG_VALUE_1=false
    volumes:
      - ${HOME}/.claude/projects:/home/q/.claude/projects:z
      - ${HOME}/.pi/agent/sessions:/home/q/.pi/agent/sessions:z
      - ${HOME}/.pi/agent/auth.json:/home/q/.pi/agent/auth.json:z
      - ${HOME}/.pi/agent/memory:/home/q/.pi/agent/memory:z
      - devenv-cache:/home/q/.cache/devenv
      - devenv-mason:/home/q/.local/share/nvim/mason
      # Папка, а не том: так store видно на хосте. Отдельно от /nix хоста
      - ${HOME}/.local/share/devenv/nix:/nix:z
